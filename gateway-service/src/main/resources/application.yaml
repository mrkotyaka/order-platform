server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      routes:
        # 1. AUTH SERVICE
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        # 1.1 CUSTOMERS (auth-service)
        - id: customers-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/customers/**
          filters:
            - AuthenticationFilter

        # 2. ORDER SERVICE
        - id: order-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/orders/**, /api/items/**
          filters:
            - AuthenticationFilter

        # 3. PAYMENT SERVICE
        - id: payment-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/payments/**
          filters:
            - AuthenticationFilter

        # 4. DELIVERY SERVICE
        - id: delivery-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/couriers/**, /api/deliveries/**
          filters:
            - AuthenticationFilter

jwt:
  secret: ${JWT_SECRET:PO50Kb9HTXs0CZfgE1c7HpJKFKkYQW6ybn3KDRBM5qO}