spring:
  application:
    name: order-service
  datasource:
#    driver-class-name: org.postgresql.Driver
#    password: postgres
#    username: postgres
#    url: jdbc:postgresql://localhost:5433/orders
    driver-class-name: org.postgresql.Driver
    password: ${POSTGRES_PASSWORD:postgres}
