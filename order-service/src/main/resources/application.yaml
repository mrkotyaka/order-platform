spring:
  cloud:
    compatibility-verifier:
      enabled: false
  application:
    name: order-service
  datasource:
    driver-class-name: org.postgresql.Driver
    password: ${POSTGRES_PASSWORD:postgres}
    username: ${POSTGRES_USER:postgres}
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5433/${POSTGRES_DB_ORDERS:orders}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  kafka:
    consumer:
      group-id: order-service-group
    bootstrap-servers: localhost:9092
server:
  port: 8087

payment-service:
  base-url: http://localhost:8088

order-paid-topic: order.events
delivery-assigned-topic: delivery.events
notification-topic: notifications